# === ccchain Sentinel Rules (deny-first safety net) ===
# Curated for auto / dontAsk / headless modes, where `ask` is not routed to
# a human. Every deny includes a message explaining WHY the command was
# blocked, HOW to accomplish the goal safely, and (where applicable) the
# approval path. "A blocked call becomes a conversation."
#
# https://github.com/fruitriin/EnumaElish

settings:
  max_context_depth: 3
  max_rules_per_cmd: 8
  fallback: ask
  strict_config_error: true

# --- Templates ---

template primitive
  |,>>
    allow cat, echo, head, tail, wc, sort, uniq

template safeRead
  next: primitive
  |,>>
    allow grep, awk, sed

template bulkExec
  extends: safeRead
  |,>>
    deny rm    "sentinel: piping into rm executes destructive deletes on every matched path. Redirect the list to a tempfile (`... > /tmp/targets.txt`), review it, then delete: `xargs rm < /tmp/targets.txt`. Owner approval: run interactively."
  exec:
    deny rm    "sentinel: `find -exec rm` (or -execdir) mass-deletes without review. Use `find -print > /tmp/targets.txt`, review, then `xargs rm < /tmp/targets.txt`. Owner approval: run interactively."
    allow cp, mv, touch

# --- PreToolUse Rules ---

preToolUse

# --- Safe reads (unchanged from the default preset) ---
allow cat
  next: primitive
allow echo
allow pwd
allow ls
  next: primitive
allow head
allow tail
allow wc
allow sort
allow uniq
allow which
allow diff
allow mkdir

# --- find: -exec rm / -delete deny ---
allow find
  next: bulkExec
  args:
    (^|\s)-delete(\s|$): deny  "sentinel: find -delete performs mass deletion without a review step. Instead: `find ... -print > /tmp/targets.txt`, review the list, then `xargs rm < /tmp/targets.txt`. Owner approval: run interactively."

allow xargs
  next: bulkExec

allow grep
  next: safeRead

# --- Network: curl|<shell/interpreter> and wget|<shell/interpreter> ---
# Piping a download directly into an interpreter executes unreviewed remote
# code — the classic "curl | bash" supply-chain vector. We deny explicit
# shells and inline interpreters that treat stdin as code.
allow curl
  |
    deny bash     "sentinel: `curl ... | bash` executes remote code without review. Save to a tempfile (`curl -o /tmp/install.sh`), inspect it, then run `bash /tmp/install.sh` explicitly. Owner approval: run interactively."
    deny sh       "sentinel: `curl ... | sh` executes remote code without review. Save and inspect first (see message on curl|bash)."
    deny zsh      "sentinel: `curl ... | zsh` executes remote code without review. Save and inspect first."
    deny ksh      "sentinel: `curl ... | ksh` executes remote code without review. Save and inspect first."
    deny dash     "sentinel: `curl ... | dash` executes remote code without review. Save and inspect first."
    deny fish     "sentinel: `curl ... | fish` executes remote code without review. Save and inspect first."
    deny python   "sentinel: `curl ... | python` executes remote code without review. Save the file, review it, then run explicitly."
    deny python3  "sentinel: `curl ... | python3` executes remote code without review. Save the file, review it, then run explicitly."
    deny ruby     "sentinel: `curl ... | ruby` executes remote code without review. Save and inspect first."
    deny perl     "sentinel: `curl ... | perl` executes remote code without review. Save and inspect first."
    deny node     "sentinel: `curl ... | node` executes remote code without review. Save and inspect first."
    deny php      "sentinel: `curl ... | php` executes remote code without review. Save and inspect first."

allow wget
  |
    deny bash     "sentinel: `wget ... | bash` executes remote code without review. Use `wget -O /tmp/install.sh`, inspect it, then run `bash /tmp/install.sh` explicitly. Owner approval: run interactively."
    deny sh       "sentinel: `wget ... | sh` executes remote code without review. Save and inspect first."
    deny zsh      "sentinel: `wget ... | zsh` executes remote code without review. Save and inspect first."
    deny ksh      "sentinel: `wget ... | ksh` executes remote code without review. Save and inspect first."
    deny dash     "sentinel: `wget ... | dash` executes remote code without review. Save and inspect first."
    deny fish     "sentinel: `wget ... | fish` executes remote code without review. Save and inspect first."
    deny python   "sentinel: `wget ... | python` executes remote code without review. Save and inspect first."
    deny python3  "sentinel: `wget ... | python3` executes remote code without review. Save and inspect first."
    deny ruby     "sentinel: `wget ... | ruby` executes remote code without review. Save and inspect first."
    deny perl     "sentinel: `wget ... | perl` executes remote code without review. Save and inspect first."
    deny node     "sentinel: `wget ... | node` executes remote code without review. Save and inspect first."
    deny php      "sentinel: `wget ... | php` executes remote code without review. Save and inspect first."

# --- Protected paths for rm ---
# We deny rm when the *target* is a lone protected root — /, ~, $HOME,
# .git. Standalone rm on a specific file inside these roots remains ask.
ask rm
  message: "confirm file deletion"
  unattended: deny
  args:
    (^|\s)/(\s|$): deny  "sentinel: `rm ... /` targets the root filesystem and would wipe the machine. Spell out a specific subpath (e.g. /tmp/build) instead. Owner approval: run interactively with the exact path."
    (^|\s)~(\s|$): deny  "sentinel: `rm ... ~` targets your home directory and would wipe dotfiles and config. Spell out a subpath (~/subdir/file). Owner approval: run interactively."
    (^|\s)~/(\s|$): deny  "sentinel: `rm ... ~/` targets your home directory contents. Spell out a subpath. Owner approval: run interactively."
    (^|\s)\$HOME(\s|/?\s|$): deny  "sentinel: `rm ... $HOME` targets your home directory. Spell out a subpath. Owner approval: run interactively."
    (^|\s)\.git(\s|/|$): deny  "sentinel: `rm ... .git` destroys repository history. Use git commands (git reset, git checkout) to reset state, or `git clone --mirror` to back up first. Owner approval: run interactively."

# --- git: protect force-push, hard reset, branch -D, filter-*, config hooks ---
allow git
  args:
    ^(status|log|diff|show|branch|tag|stash|ls-files|remote|rev-parse|worktree|blame|reflog)\b: allow
    ^(add|commit|checkout|merge|rebase|fetch|pull|clone|switch|restore|cherry-pick|revert)\b: allow
    ^push\b: ask  "sentinel: git push publishes local commits to a remote; confirm the branch/remote."
    # Denies below MUST come after the generic allow lines above: args:
    # rules are last-match-wins, so a later deny must override an earlier
    # broad allow (`branch` matches the generic allow for `git branch -D`).
    ^branch\s+-D\b: deny  "sentinel: `git branch -D` deletes a branch without a merge check and can lose unpushed commits. Create a backup ref first: `git rev-parse <branch> > /tmp/backup-ref` (or `git tag backup/<branch> <branch>`), then delete. Owner approval: run interactively after confirming the ref is preserved."
    ^branch\s+--delete\s+--force\b: deny  "sentinel: `git branch --delete --force` bypasses the merge check. Create a backup ref (git tag backup/<branch> <branch>) first. Owner approval: run interactively."
    ^branch\s+-d\s+--force\b: deny  "sentinel: `git branch -d --force` bypasses the merge check. Create a backup ref first. Owner approval: run interactively."
    # `\b` alone would treat `--force-with-lease` as matching `--force`; anchor
    # the trailing side to whitespace/EOL so lease is not accidentally caught.
    ^push\b.*(\s|^)--force(\s|$): deny  "sentinel: `git push --force` rewrites remote history and can drop teammates' commits. Prefer `--force-with-lease`, coordinate with the team, or push to a review branch. Owner approval: run interactively."
    # `-f` must be its own token — do not use `\b`; a bare `\b` would match
    # inside e.g. `--force` (matched separately above) and false-positive.
    ^push\b(.*\s)?-f(\s|$): deny  "sentinel: `git push -f` is a force-push; see `--force` message."
    ^push\b.*(\s|^)--force-with-lease(\s|$): ask  "sentinel: force-with-lease still rewrites remote history; confirm the branch."
    ^push\s+.*\s\+(main|master|develop|release)\b: deny  "sentinel: refspec `+branch` is a force-push to a protected branch. Push to a review branch instead. Owner approval: run interactively."
    ^reset\s+--hard\b: deny  "sentinel: `git reset --hard` discards all uncommitted changes in the working tree. Commit or stash first (git stash push -u), then reset. Owner approval: run interactively."
    ^clean\s+-[a-zA-Z]*f[a-zA-Z]*d[a-zA-Z]*\b: deny  "sentinel: `git clean -fd` deletes untracked files and directories. Preview first with `git clean -nd`, then delete only what's listed. Owner approval: run interactively."
    ^clean\s+-[a-zA-Z]*d[a-zA-Z]*f[a-zA-Z]*\b: deny  "sentinel: `git clean -df` deletes untracked files. Preview first with `git clean -nd`. Owner approval: run interactively."
    ^(filter-branch|filter-repo)\b: deny  "sentinel: filter-branch / filter-repo rewrites history and can execute arbitrary code from refs. Back up the repo (git clone --mirror), review, then run interactively."
    ^config\s+.*(editor|pager|hook|gpg\.program|core\.sshCommand): deny  "sentinel: `git config` for editor/pager/hook/sshCommand/gpg.program enables arbitrary code execution on future git operations. Set these interactively after review."

# --- Permission/ownership: widespread recursive chmod/chown ---
# The protected-path patterns below use `.*\s/` (rather than `\s+/`) so that
# the target path can come AFTER the mode (e.g. `chmod -R 755 /`, not just
# `chmod -R /`). The trailing `(\s|$)` prevents `/home/foo` from matching.
allow chmod
  args:
    (^|\s)-R\b.*\s/(\s|$): deny  "sentinel: `chmod -R ... /` cascades permission changes across the entire filesystem. Scope to a subdirectory. Owner approval: run interactively."
    (^|\s)-R\b.*\s~(\s|/|$): deny  "sentinel: `chmod -R ... ~` cascades permission changes across your home directory. Scope to a subdirectory."
    (^|\s)-R\b.*\s\$HOME(\s|/|$): deny  "sentinel: `chmod -R $HOME` cascades permission changes across your home directory."
    (^|\s)--recursive\b.*\s/(\s|$): deny  "sentinel: `chmod --recursive ... /` cascades permission changes across the filesystem."
    -[a-zA-Z]*R[a-zA-Z]*\s+.*\b777\b: deny  "sentinel: `chmod -R 777` opens every child file to world write/execute. Prefer 755 (dirs) / 644 (files), or use setfacl for specific users."
    \b777\b: deny  "sentinel: 777 grants write and execute to every local user. Prefer 755 (dirs) / 644 (files); use user-specific ACLs when needed."

allow chown
  args:
    (^|\s)-R\b.*\s/(\s|$): deny  "sentinel: `chown -R ... /` cascades ownership changes across the filesystem. Scope to a subdirectory. Owner approval: run interactively."
    (^|\s)-R\b.*\s~(\s|/|$): deny  "sentinel: `chown -R ... ~` cascades ownership changes across your home directory."
    (^|\s)--recursive\b.*\s/(\s|$): deny  "sentinel: `chown --recursive ... /` cascades ownership changes across the filesystem."

# --- Dynamic code execution ---
deny eval  "sentinel: eval is not statically analyzable — ccchain cannot inspect the string it will run. Write the command directly so the actual invocation is visible in the audit trail."

# `source` (a.k.a. `.`) executes a file's contents in the current shell.
# We keep it at ask for legitimate use like `source ~/.bashrc`, and hard-
# deny the two remote-installer patterns we can detect statically.
# Note: `source $(cmd)` cannot be caught by args: because ccchain skips
# args: rules when arguments contain $ / backtick (dynamic expansion). It
# will fall through to the base `ask` action instead — still not allow.
allow source
  args:
    <\(: deny  "sentinel: `source <(...)` executes the output of a subshell as commands (typical `source <(curl ...)` install pattern). Save to a tempfile (`curl ... > /tmp/env.sh`), inspect, then `source /tmp/env.sh`."

# `.` is the POSIX alias for source. We can't easily deny `.` by name
# because it clashes with a common cwd literal, so document the risk in
# the source deny and rely on the eval deny for typical bootstrap scripts.

# --- Disk / device write ---
# `dd` is powerful enough that its default in sentinel is ask, not allow —
# an unrecognized target (e.g. of=/tmp/x) should require a confirmation.
# Explicit safe sinks (of=/dev/null) escalate up to allow via args:.
ask dd  "sentinel: dd is a raw-device writer; confirm the target of=<path>."
  unattended: deny
  args:
    \bof=/dev/(null|zero|random|urandom|stdout|stderr|tty)\b: allow
    \bof=/dev/(sd|nvme|hd|disk|mmcblk)[a-z0-9]*\b: deny  "sentinel: `dd of=/dev/sd*` overwrites a raw block device (data loss on that disk). Double-check the target with `lsblk`/`diskutil list`, use --dry-run when available, and run interactively."
    \bof=/(\s|$): deny  "sentinel: `dd of=/` writes to the root directory; almost certainly a typo for a subpath."

deny mkfs         "sentinel: mkfs formats a filesystem (destroys existing data). Confirm the target device and run interactively."
deny mkfs.ext2    "sentinel: mkfs.ext2 formats a filesystem (destructive). Run interactively."
deny mkfs.ext3    "sentinel: mkfs.ext3 formats a filesystem (destructive). Run interactively."
deny mkfs.ext4    "sentinel: mkfs.ext4 formats a filesystem (destructive). Run interactively."
deny mkfs.xfs     "sentinel: mkfs.xfs formats a filesystem (destructive). Run interactively."
deny mkfs.btrfs   "sentinel: mkfs.btrfs formats a filesystem (destructive). Run interactively."
deny mkfs.vfat    "sentinel: mkfs.vfat formats a filesystem (destructive). Run interactively."
deny mkfs.fat     "sentinel: mkfs.fat formats a filesystem (destructive). Run interactively."
deny mkfs.exfat   "sentinel: mkfs.exfat formats a filesystem (destructive). Run interactively."
deny newfs        "sentinel: newfs formats a filesystem (destructive). Run interactively."
deny mkswap       "sentinel: mkswap formats a swap partition (destructive). Run interactively."

allow diskutil
  args:
    ^(list|info|verifyDisk|verifyVolume|mount|unmount)\b: allow
    ^(eraseDisk|eraseVolume|reformat|zeroDisk|secureErase|randomDisk)\b: deny  "sentinel: `diskutil eraseDisk|eraseVolume|reformat|zeroDisk|secureErase` is destructive. Run interactively with the exact target verified."
    ^apfs\s+deleteContainer\b: deny  "sentinel: `diskutil apfs deleteContainer` destroys an APFS container. Run interactively."
    ^apfs\s+deleteVolume\b: deny  "sentinel: `diskutil apfs deleteVolume` destroys an APFS volume. Run interactively."

# --- ccchain self-approval fence ---
# The approval token flow (Plan 0022 Phase 3) requires the *owner* to run
# `ccchain approve` on their own terminal. Denying it here — combined with
# hook-based Bash going through ccchain — prevents an agent from executing
# approve on behalf of the owner even if it sees the command in hint text.
allow ccchain
  args:
    ^approve\b: deny  "sentinel: `ccchain approve` must be executed by the human owner on their own terminal, not by an agent. This deny is intentional and enforces the self-approval fence. Owner: run the command yourself."

# --- ccchain self-modification fence (attacker C7) ---
# The deny-first safety net depends on the sentinel/default config not being
# rewritten out from under it. An agent that can Write / Edit .ccchain.conf
# (or .ccchain.local.conf) can inject `ask_strategy: passthrough`, replace
# every deny with allow, or swap the entire ruleset — bypassing every other
# sentinel line above. Denying Edit / Write on these paths closes that hole.
#
# Reads are NOT denied here: `ccchain audit` and normal review workflows read
# the file, and an agent that only reads cannot subvert the fence.
allow Edit
  args:
    \.ccchain(\.local)?\.conf$: deny  "sentinel: editing ccchain's own configuration would disable the deny-first safety net. Owner: edit the file directly outside the agent's tool surface, or use `ccchain init` to regenerate."
allow Write
  args:
    \.ccchain(\.local)?\.conf$: deny  "sentinel: writing to ccchain's own configuration would disable the deny-first safety net. Owner: edit the file directly outside the agent's tool surface."
